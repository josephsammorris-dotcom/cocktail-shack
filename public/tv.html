<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cocktail Shack · TV</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "/vendor/three.module.min.js" } }</script>
<style>
:root{ --ink:#123c4a; --muted:#5f7f8c; --coral:#ff6b5e; --coral2:#ff8a5e; --teal:#14b8a6; --good:#16a34a; --mid:#d97706; --bad:#dc2626;
  --sky-top:#7dd8f7; --sky-bot:#cdeffb; --u:calc(min(1vw, 1.78vh)); }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b6e8e;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;cursor:default}
body{background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bot) 22%,var(--sky-bot) 100%);transition:background 1s}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
/* 5% safe margin for TVs that crop */
.safe{position:absolute;inset:5vh 5vw}
.pillbox{background:rgba(255,255,255,.92);border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*.8) calc(var(--u)*1.4);box-shadow:0 10px 30px -14px rgba(18,60,74,.55);font-weight:800}
#tl{position:absolute;left:0;top:0;display:flex;gap:calc(var(--u)*.8);align-items:center;font-size:calc(var(--u)*1.45);max-width:52%}
#tr{position:absolute;right:0;top:0;display:flex;gap:calc(var(--u)*.8);align-items:center;font-size:calc(var(--u)*1.45);max-width:46%}
#tl .pillbox,#tr .pillbox{white-space:nowrap}
/* the caption sits at the top; it steps aside while a full card (briefing, results, finale) is up */
body.card-up #cap{opacity:0}
.wk{background:var(--ink);color:#fff}
.up{color:var(--bad)}
#cap{position:absolute;left:50%;top:calc(var(--u)*5.6);transform:translateX(-50%);max-width:88%;text-align:center;font-size:calc(var(--u)*1.7);
  background:rgba(18,60,74,.9);color:#fff;border-radius:999px;padding:calc(var(--u)*.8) calc(var(--u)*2);transition:opacity .4s}
#cap:empty{opacity:0}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.95);border-radius:calc(var(--u)*2.4);
  padding:calc(var(--u)*2.2) calc(var(--u)*2.8);box-shadow:0 30px 60px -20px rgba(18,60,74,.6);transition:opacity .5s, transform .5s}
.panel.hide{opacity:0;transform:translate(-50%,-46%);pointer-events:none}
h1{margin:0;font-weight:900;letter-spacing:-.03em}
.hide{display:none!important}
/* lobby */
/* lobby: a slim, see-through panel down the left side, so the beach fills the rest of the screen */
#lobby.panel{left:3vw;top:50%;transform:translateY(-50%) scale(var(--fit,1));transform-origin:left center;width:calc(var(--u)*28);display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:calc(var(--u)*.9);padding:calc(var(--u)*1.6) calc(var(--u)*1.6);background:rgba(255,255,255,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:calc(var(--u)*2)}
#lobby.panel.hide{transform:translate(-30%,-50%) scale(var(--fit,1))}
#lobby h1{white-space:nowrap;font-size:calc(var(--u)*3);background:linear-gradient(135deg,var(--coral),#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
#lobby .tag{color:var(--muted);font-weight:700;font-size:calc(var(--u)*1.2);margin-top:calc(var(--u)*-.4)}
.code{font-size:calc(var(--u)*4.2);font-weight:900;letter-spacing:.14em;color:var(--ink);line-height:1;margin-right:-.14em}
.join{font-size:calc(var(--u)*1.2);color:var(--muted);font-weight:700;line-height:1.35}
.join b{color:var(--ink)}
#qr{background:#fff;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.8);width:calc(var(--u)*13);height:calc(var(--u)*13);flex:none}
#lobby .join{width:100%}
#joinurl{display:block;white-space:nowrap;font-size:1em;overflow:hidden}
#qr svg{width:100%;height:100%;display:block}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*.5);width:100%}
.seat{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;border-radius:999px;padding:calc(var(--u)*.45) calc(var(--u)*1);font-weight:800;font-size:calc(var(--u)*1.25);color:#fff;display:flex;gap:.5em;align-items:center}
.seat.empty{background:rgba(238,243,245,.8);color:#9fb3bb}
.seat .l{background:rgba(255,255,255,.3);border-radius:50%;width:1.5em;height:1.5em;display:grid;place-items:center;font-size:.85em}
#lobby .hint{margin-top:0;font-size:calc(var(--u)*1.1)}
.hint{color:var(--muted);font-weight:600;font-size:calc(var(--u)*1.3);margin-top:calc(var(--u)*1.2)}
.kbd{display:inline-block;border:2px solid #cfdde2;border-bottom-width:4px;border-radius:8px;padding:0 .4em;font-weight:800;color:var(--ink)}
/* briefing */
/* briefing: a compact, see-through strip along the bottom of the TV (empty sand), so the beach stays in view */
#brief.panel{top:auto;bottom:4.5vh;transform:translateX(-50%);padding:0;background:transparent;box-shadow:none;border-radius:0;
  display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.7);width:max-content;max-width:90vw}
#brief.panel.hide{transform:translate(-50%,30%)}
.bstrip{display:flex;gap:calc(var(--u)*1);align-items:stretch}
.bcard{flex:0 0 calc(var(--u)*28);min-width:0;display:flex;align-items:center;gap:calc(var(--u)*1);background:rgba(255,255,255,.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*.8) calc(var(--u)*1.5) calc(var(--u)*.8) calc(var(--u)*1);box-shadow:0 10px 26px -14px rgba(18,60,74,.6)}
.bcard .big{font-size:calc(var(--u)*4.2);line-height:1;flex:none}
.bcard .k{font-size:calc(var(--u)*1.05);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.bcard .v{font-size:calc(var(--u)*1.85);font-weight:900;line-height:1.1}
.bcard .s{font-size:calc(var(--u)*1.2);font-weight:700;color:var(--muted)}
.bcard .s.up{color:var(--bad)}
.gull{width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);display:block;flex:none;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8%) rotate(-4deg)}}
.bigmatch{background:linear-gradient(135deg,#f59e0b,#ff6b5e);color:#fff;font-weight:900;font-size:calc(var(--u)*1.7);padding:.3em 1em;border-radius:999px;white-space:nowrap;
  box-shadow:0 10px 24px -10px rgba(0,0,0,.4);transform:rotate(-1.5deg)}
.roll{white-space:nowrap;font-size:calc(var(--u)*1.3);font-weight:700;background:rgba(18,60,74,.82);color:#fff;border-radius:999px;padding:.35em 1.1em}
/* forecast record: a compact card in the bottom-right corner, on the empty sand (and over the results card's empty corner) */
#wxrec{position:absolute;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:calc(var(--u)*1);padding:calc(var(--u)*.5) calc(var(--u)*.7);box-shadow:0 10px 26px -14px rgba(18,60,74,.6)}
#wxrec .t{font-size:calc(var(--u)*1);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:calc(var(--u)*.3);display:flex;gap:1em}
#wxrec .t b{margin-left:auto;color:var(--ink)}
#wxrec .g{display:flex;gap:calc(var(--u)*.2);align-items:stretch}
#wxrec .lab,#wxrec .c{display:grid;grid-template-rows:calc(var(--u)*1.3) calc(var(--u)*1.8) calc(var(--u)*1.8) calc(var(--u)*1.3)}
#wxrec .lab{font-size:calc(var(--u)*.9);font-weight:800;color:var(--muted);align-items:center;padding-right:.2em}
#wxrec .c{width:calc(var(--u)*2.1);place-items:center;border-radius:calc(var(--u)*.5);font-size:calc(var(--u)*1.3);background:rgba(18,60,74,.06);overflow:hidden}
#wxrec .c .n{font-size:calc(var(--u)*.9);font-weight:800;color:var(--muted)}
#wxrec .c .m{font-size:calc(var(--u)*.95);font-weight:900;color:#fff;width:100%;height:100%;display:grid;place-items:center}
#wxrec .c.ok{background:rgba(22,163,74,.14)} #wxrec .c.ok .m{background:var(--good)}
#wxrec .c.bad{background:rgba(220,38,38,.12)} #wxrec .c.bad .m{background:var(--bad)}
#wxrec .c.fut{opacity:.4}
#wxrec .c.new{animation:pop .7s}
@keyframes pop{40%{transform:scale(1.35)}}
.bcard .dots{display:flex;gap:calc(var(--u)*.2);margin-top:calc(var(--u)*.3);flex-wrap:wrap}
.bcard .dots i{font-style:normal;width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);border-radius:50%;display:grid;place-items:center;color:#fff;font-size:calc(var(--u)*.7);font-weight:900}
.bcard .dots i.ok{background:var(--good)} .bcard .dots i.bad{background:var(--bad)}
/* planning */
#clock{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:calc(var(--u)*4.2);font-weight:900;font-variant-numeric:tabular-nums;padding:calc(var(--u)*.4) calc(var(--u)*2)}
#clock.low{color:var(--bad)}
.tag3d{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-weight:800;font-size:calc(var(--u)*1.5);border-radius:999px;padding:.35em .9em;
  background:#fff;box-shadow:0 8px 20px -10px rgba(0,0,0,.5);display:flex;gap:.4em;align-items:center}
.tag3d.locked{background:var(--teal);color:#fff}
.tag3d.counter{font-size:calc(var(--u)*2.6);font-variant-numeric:tabular-nums;color:#fff;padding:.25em .8em;border:4px solid #fff}
.tag3d.counter small{font-size:.55em;opacity:.85}
.tag3d.away{background:#64748b;color:#fff}
/* stinger */
#sting{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-3deg);font-size:calc(var(--u)*4);font-weight:900;color:#fff;
  background:linear-gradient(135deg,#ef4444,#f97316);padding:.3em 1em;border-radius:999px;opacity:0;transition:opacity .3s,transform .3s;white-space:nowrap}
#sting.show{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1.05)}
#sting.ok{background:linear-gradient(135deg,#16a34a,#14b8a6);font-size:calc(var(--u)*2.4)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
/* results */
#results{width:min(92vw, calc(var(--u)*120));top:53%}
#results h2{margin:0 0 calc(var(--u)*1);font-size:calc(var(--u)*2.8);font-weight:900;display:flex;align-items:center;gap:.5em}
table.lb{width:100%;border-collapse:collapse;font-size:calc(var(--u)*1.7);font-variant-numeric:tabular-nums}
table.lb th{font-size:calc(var(--u)*1.2);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;padding:0 .6em .4em}
table.lb th:first-child,table.lb td:first-child{text-align:left}
table.lb td{padding:.45em .6em;text-align:right;font-weight:700;border-top:2px solid #f3ead9;white-space:nowrap}
table.lb td.bar{display:flex;align-items:center;gap:.5em;font-weight:900}
.sw{width:1.1em;height:1.1em;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:.65em;font-weight:900;flex:none}
.faces{font-size:1.2em;letter-spacing:.1em;white-space:nowrap}
.note{white-space:normal!important;font-style:italic;color:var(--muted);font-weight:600;font-size:.8em;text-align:left!important;max-width:16em}
.neg{color:var(--bad)} .pos{color:var(--good)}
.out{opacity:.5}
.best{margin-top:calc(var(--u)*1.2);background:#e6faf7;color:#115e59;border-radius:999px;padding:.5em 1.2em;font-weight:800;font-size:calc(var(--u)*1.7);display:inline-block}
.bust{margin-top:calc(var(--u)*1);background:#fde8e8;color:#991b1b;border-radius:999px;padding:.5em 1.2em;font-weight:800;font-size:calc(var(--u)*1.6);display:inline-block;margin-left:.6em}
/* finale */
#finale{text-align:center;min-width:calc(var(--u)*70)}
#finale h1{font-size:calc(var(--u)*4.4)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:calc(var(--u)*1.4);margin:calc(var(--u)*2) 0 calc(var(--u)*1)}
.step{width:calc(var(--u)*18);border-radius:calc(var(--u)*1.2) calc(var(--u)*1.2) 0 0;color:#fff;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding-top:calc(var(--u)*1);font-weight:900}
.step .m{font-size:calc(var(--u)*4)} .step .n{font-size:calc(var(--u)*1.8);padding:0 .4em} .step .w{font-size:calc(var(--u)*2.2);font-variant-numeric:tabular-nums}
#confetti{position:fixed;inset:0;pointer-events:none}
/* host menu and debug */
#menu{pointer-events:auto;min-width:calc(var(--u)*44);font-size:calc(var(--u)*1.5)}
#menu h2{margin:0 0 .6em}
#menu .row{display:flex;justify-content:space-between;align-items:center;gap:1em;padding:.35em 0;border-top:1px solid #f0e6d4}
#menu button,#menu select{font:inherit;font-weight:700;border-radius:999px;border:0;padding:.4em 1em;background:#eef8f7;color:#0f766e;cursor:pointer}
#menu button.danger{background:#fde8e8;color:#991b1b}
#debug{position:absolute;left:1vw;bottom:1vh;background:rgba(0,0,0,.7);color:#bef264;font:600 13px/1.4 ui-monospace,Menlo,monospace;padding:8px 12px;border-radius:8px;white-space:pre}
#soundhint{position:absolute;left:0;top:calc(var(--u)*5.6);font-size:calc(var(--u)*1.3);font-weight:700;color:var(--ink);background:rgba(255,255,255,.85);border-radius:999px;padding:.4em 1em}
#err{position:fixed;inset:0;display:grid;place-items:center;background:rgba(18,60,74,.85);color:#fff;font-size:calc(var(--u)*2.4);font-weight:800;text-align:center;padding:5vw}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* player photos */
.pic{width:1.5em;height:1.5em;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 .15em var(--pc,#fff)}
.seat .pic{width:1.6em;height:1.6em;margin-left:-.3em}
.ini{display:inline-grid;place-items:center;color:#fff;font-weight:900;font-size:.62em;letter-spacing:-.02em}
.seat .ini{font-size:.7em}
.step .face.ini{font-size:calc(var(--u)*2.6)}
.step .face{width:calc(var(--u)*7);height:calc(var(--u)*7);border-radius:50%;object-fit:cover;box-shadow:0 0 0 calc(var(--u)*.4) #fff;margin-bottom:calc(var(--u)*.4)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="confetti"></canvas>
<div id="flash"></div>
<div id="ui">
  <div id="tags"></div>
  <div class="safe">
    <div id="tl"></div>
    <div id="tr"></div>
    <div id="wxrec" class="hide"></div>
    <div id="clock" class="pillbox hide"></div>
    <div id="sting"></div>
    <div id="cap"></div>
    <div id="soundhint">🔈 Press any key to enable sound</div>
  </div>
  <div id="lobby" class="panel hide">
    <h1>Cocktail Shack</h1>
    <div class="tag">A beach bar game for 1 to 4 players</div>
    <div id="qr"></div>
    <div class="join">Scan the code, or go to<b id="joinurl"></b>and enter</div>
    <div class="code" id="code">····</div>
    <div class="seats" id="seats"></div>
    <div class="hint" id="lobbyhint"></div>
  </div>
  <div id="brief" class="panel hide"></div>
  <div id="results" class="panel hide"></div>
  <div id="finale" class="panel hide"></div>
  <div id="menu" class="panel hide"></div>
  <div id="debug" class="hide"></div>
</div>
<div id="err" class="hide"></div>
<script src="/vendor/qrcode.js"></script>
<script type="module" src="/tv.js"></script>
</body>
</html>
